<style>

.ad{border-left:1px solid var(--ln);padding:3px;min-height:28px}

.pm{display:grid;grid-template-columns:1fr 340px;height:100%;min-height:0}

.go{background:var(--ac);color:#fff;border-radius:22px;padding:12px 56px;font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 24px}.stat div{background:var(--pn);border-radius:8px;padding:12px;color:var(--mut);font-size:12px}.stat b{display:block;font-size:22px;color:var(--ink);font-weight:500;margin-top:4px}
.hs{display:flex;align-items:center;padding:0 12px}.hs i{width:30px;text-align:center;font-style:normal;font-size:11px;color:var(--mut)}.hs i b{display:block;font-size:13px;color:var(--ink)}.hs i.t b{color:var(--ac)}
.hr2{display:flex;align-items:center;gap:12px;background:var(--pn);border-radius:10px;padding:12px;margin-bottom:8px}
.hi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.hr2 small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.hc{width:30px;height:30px;display:grid;place-items:center}.hc span{width:20px;height:20px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:11px;color:#fff}.hc.y span{background:var(--ac)}
.addh{display:flex;gap:8px;margin:6px 0 12px}.addh input,.addh select{background:var(--pn);border:0;border-radius:8px;padding:10px 12px}.addh input{flex:1}
.scrim{display:none}
@media (max-width:820px){
 #app{grid-template-columns:1fr!important;padding-bottom:56px}
 .rail{position:fixed;bottom:0;left:0;right:0;height:calc(56px + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);flex-direction:row;justify-content:space-around;z-index:25;border-top:1px solid var(--ln)}
 .rail .sp,.logo,.dk{display:none}.rb{display:flex;flex:1;width:auto;height:56px;border-radius:0;flex-direction:column;gap:2px}.rb small{display:block}.rb.on{color:var(--ac)}.qa{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));margin:0;padding:8px 12px;background:var(--bg);border-top:1px solid var(--ln);z-index:12}.body{padding-bottom:84px}.row{padding:14px 12px}input,select,textarea{font-size:16px}
 aside{position:fixed;inset:0 auto 56px 0;width:270px;z-index:20;transform:translateX(-105%);transition:transform .2s}aside.show{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
 #menu{display:grid}.hd,.body{padding-left:12px;padding-right:12px}.qa{margin:4px 12px 10px}
 .det{position:fixed;inset:0;z-index:30;border:0}.back{display:grid!important}
 .pm{grid-template-columns:1fr;overflow:auto}.pm>div{overflow:visible}.ring{width:250px;height:250px}
}
.back{display:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>

<script>
const K='sdelano.v2',DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],COL=['#3F7FD9','#D9694F','#3FA796','#9C6FD6','#C9962E','#D05A8C'],GR=['Утро','День','Ночь'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const P={mode:'pomo',run:false,left:1500,end:0,st:0,el:0};
const sv=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>',IC={tasks:sv('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'),cal:sv('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),pomo:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>'),hab:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),search:sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>'),acc:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>')};
function iso(n){const d=new Date();d.setDate(d.getDate()+n);return f(d)}
function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
if(!S){S={seed:1,tasks:[],lists:[{id:'l1',name:'Работа',c:COL[2]},{id:'l2',name:'Личное',c:COL[1]}],habits:[],focus:[],tab:'tasks',view:'today',sel:null,wk:0,mo:0,cm:'month',q:''};
 const T=iso(0);S.tasks=[
 {id:'a1',title:'Добро пожаловать! Нажмите на задачу, чтобы открыть детали',note:'Дата, время, приоритет, метки и подзадачи.',date:T,time:'09:00',prio:2,list:'inbox',done:false,del:false,tags:['старт'],subs:[{t:'Отметить подзадачу',d:false}]},
 {id:'a2',title:'Купить продукты',note:'',date:T,time:'18:30',prio:0,list:'l2',done:false,del:false,tags:[],subs:[{t:'Молоко',d:false},{t:'Хлеб',d:false}]},
 {id:'a3',title:'Подготовить отчёт',note:'',date:iso(2),time:'11:00',prio:3,list:'l1',done:false,del:false,tags:[],subs:[]}];
 S.habits=[['Утренняя зарядка','Утро'],['Выпить стакан воды','Утро'],['Учить 20 английских слов в день','Ночь'],['Тренировка','Ночь'],['Чтение','Ночь']].map((h,i)=>({id:'h'+i,name:h[0],g:h[1],days:{}}))}
S.yr=S.yr||0;S.md=S.md||0;S.nd=S.nd||3;S.theme=S.theme||'auto';S.ts=S.ts||(S.seed?0:Date.now());
let cloud=null,syncT=0,SY='Синхронизация не подключена';
function pack(){return{tasks:S.tasks,lists:S.lists,habits:S.habits,focus:S.focus,ts:S.ts}}
function save(){S.seed=0;S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(cloud){clearTimeout(syncT);syncT=setTimeout(push,800)}clearTimeout(natT);natT=setTimeout(nat,1500)}
function push(){const d=pack();cloud.set({json:JSON.stringify(d),ts:d.ts}).catch(()=>setSync('Ошибка синхронизации'))}
function pull(snap){if(!snap.exists)return;const d=snap.data();if(!d||d.ts<=S.ts)return;try{Object.assign(S,JSON.parse(d.json));if(!S.tasks.some(t=>t.id==S.sel))S.sel=null;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();setSync('Синхронизировано')}catch(e){}}
function setSync(m){SY=m;const b=document.getElementById('sy');if(b){b.title=m;b.style.color=cloud?'var(--ac)':'var(--mut)'}}
function theme(){document.documentElement.dataset.theme=S.theme=='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme}
function toast(m,keep){const t=document.getElementById('toast'),d=document.createElement('div');d.textContent=m;d.onclick=()=>d.remove();t.appendChild(d);setTimeout(()=>d.remove(),keep?20000:3500)}
function askNotif(){try{if('Notification' in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
function nxt(d,r){const T=iso(0);let x=new Date((d||T)+'T12:00');do{if(r=='d')x.setDate(x.getDate()+1);else if(r=='w')x.setDate(x.getDate()+7);else if(r=='wd'){do x.setDate(x.getDate()+1);while([0,6].includes(x.getDay()))}else if(r=='m')x.setMonth(x.getMonth()+1);else x.setFullYear(x.getFullYear()+1)}while(f(x)<T);return f(x)}
function chk(){const n=Date.now();S.tasks.forEach(x=>{if(x.del||x.done||!x.date||x.rem===undefined||x.rem==='')return;const at=new Date(x.date+'T'+(x.time||'09:00')).getTime()-x.rem*60000,key=x.date+x.time+x.rem;if(n>=at&&n-at<43200000&&x.fired!=key){x.fired=key;save();const m=x.title+(x.time?' · '+x.time:'');toast('🔔 '+m,1);beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{if(Notification.permission=='granted')new Notification('Сделано',{body:m})}catch(e){}}})}
setInterval(chk,20000);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lbl(d){if(!d)return'Без даты';const T=iso(0);if(d<T)return'Просрочено';if(d==T)return'Сегодня';if(d==iso(1))return'Завтра';return new Date(d+'T12:00').toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'long'})}
function cmp(a,b){return((a.date||'9')+(a.time||'99')).localeCompare((b.date||'9')+(b.time||'99'))||b.prio-a.prio}
function lc(x){return(S.lists.find(l=>l.id==x.list)||{c:'#4772FA'}).c}
function vis(v=S.view){const A=S.tasks.filter(x=>!x.del),T=iso(0);let a;
 if(v=='today')a=A.filter(x=>!x.done&&x.date&&x.date<=T);else if(v=='week')a=A.filter(x=>!x.done&&x.date>=T&&x.date<=iso(6));
 else if(v=='inbox')a=A.filter(x=>!x.done&&x.list=='inbox');else if(v=='done')a=A.filter(x=>x.done);else if(v=='trash')a=S.tasks.filter(x=>x.del);
 else if(v=='f:hi')a=A.filter(x=>!x.done&&x.prio==3);else if(v=='f:od')a=A.filter(x=>!x.done&&x.date&&x.date<T);
 else if(v[0]=='#')a=A.filter(x=>!x.done&&x.tags.includes(v.slice(1)));else a=A.filter(x=>!x.done&&x.list==v);
 return a.slice().sort(cmp)}
const SM={today:'Сегодня',week:'Следующие 7 дней',inbox:'Входящие',done:'Выполнено',trash:'Корзина','f:hi':'Высокий приоритет','f:od':'Просрочено'};
function title(){return SM[S.view]||(S.view[0]=='#'?S.view:(S.lists.find(l=>l.id==S.view)||{}).name)||''}
function row(x){const T=iso(0),s=S.view;
 return'<div class="row '+(x.done?'done ':'')+(S.sel==x.id?'on':'')+'" data-a="open" data-id="'+x.id+'"><button class="ck p'+x.prio+'" data-a="tog" data-id="'+x.id+'" aria-label="Выполнить"></button><span class="tt">'+esc(x.title)+'</span>'+x.tags.map(t=>'<span class="tg">#'+esc(t)+'</span>').join('')
 +(x.rep?'<span class="mt" title="Повтор">↻</span>':'')+(x.rem!==undefined&&x.rem!==''?'<span class="mt" title="Напоминание">🔔</span>':'')+(x.date?'<span class="mt '+(x.date<T&&!x.done?'od':x.date==T?'td':'')+'">'+(s=='today'||s=='week'?'':lbl(x.date)+' ')+esc(x.time)+'</span>':'')+'<span class="dot" style="background:'+lc(x)+'"></span></div>'}
function listHTML(a){if(!a.length)return'<div class="empty">Нет задач<br><small>Нажмите на поле ввода, чтобы добавить</small></div>';
 if(S.view=='done'||S.view=='trash'||a===S.res)return a.map(row).join('');
 const g={};a.forEach(x=>{const k=x.date&&x.date<iso(0)&&S.view!='inbox'?'od':x.date||'';(g[k]=g[k]||[]).push(x)});
 return Object.keys(g).sort((a,b)=>(a=='od'?'0':a||'9').localeCompare(b=='od'?'0':b||'9')).map(k=>(S.view=='today'&&k==iso(0)?'':'<div class="grp '+(k=='od'?'od':'')+'">'+(k=='od'?'Просрочено':lbl(k))+'</div>')+g[k].map(row).join('')).join('')}
function sideHTML(){const c=v=>vis(v).length||'',nv=(v,n,x)=>'<button class="nav '+(S.view==v?'on':'')+'" data-a="view" data-v="'+esc(v)+'">'+n+'<b>'+c(v)+'</b></button>',tg=[...new Set(S.tasks.filter(x=>!x.del).flatMap(x=>x.tags))];

function sbSave(){try{localStorage.setItem('sdelano.sb',JSON.stringify(SB))}catch(e){}}
async function sbq(p,o={},retry=1){const r=await fetch(SB.url+p,{...o,headers:{apikey:SB.key,Authorization:'Bearer '+SB.at,'Content-Type':'application/json',...o.headers}});if(r.status==401&&retry){const t=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SB.rt})});if(t.ok){const j=await t.json();SB.at=j.access_token;SB.rt=j.refresh_token;sbSave();return sbq(p,o,0)}logout();throw 0}return r}
function sbStart(){if(!SB||!SB.at)return;cloud={set:d=>sbq('/rest/v1/app_state?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:SB.uid,json:d.json,ts:d.ts})}).then(r=>{if(!r.ok)throw 0})};
 const get=async()=>{const r=await sbq('/rest/v1/app_state?user_id=eq.'+SB.uid+'&select=json,ts'),a=await r.json();return a[0]},ap=row=>pull({exists:true,data:()=>({json:row.json,ts:+row.ts})});
 (async()=>{try{const row=await get();if(row&&+row.ts>S.ts)ap(row);else push();setSync('Синхронизировано: '+SB.email);render()}catch(e){setSync('Ошибка синхронизации')}})();
 clearInterval(poll);poll=setInterval(async()=>{try{const row=await get();if(row)ap(row)}catch(e){}},15000)}
function logout(){clearInterval(poll);cloud=null;if(SB){SB.at=SB.rt=SB.uid=null;sbSave()}setSync('Синхронизация не подключена');document.getElementById('acc').innerHTML='';render()}
async function authGo(su){const g=i=>document.getElementById(i).value.trim(),url=g('a1').replace(/\/+$/,''),key=g('a2'),em=g('a3'),pw=document.getElementById('a4').value;if(!url||!key||!em||!pw){toast('Заполните все поля');return}
 SB={url,key,email:em};sbSave();try{const r=await fetch(url+'/auth/v1/'+(su?'signup':'token?grant_type=password'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}),j=await r.json();
 if(!r.ok){toast(j.msg||j.error_description||j.message||'Ошибка входа');return}
 if(!j.access_token){toast('Подтвердите почту по письму, затем нажмите «Войти»',1);return}
 SB={url,key,email:em,at:j.access_token,rt:j.refresh_token,uid:j.user.id};sbSave();document.getElementById('acc').innerHTML='';sbStart()}catch(e){toast('Нет связи с сервером Supabase')}}
function accUI(){const d=document.getElementById('acc');if(window.claude){toast('Здесь синхронизация идёт через ваш аккаунт claude.ai автоматически. Вход по почте нужен в APK и в версии для ПК.',1);return}if(d.firstChild){d.innerHTML='';return}const s=SB||{};
 d.innerHTML='<div class="mod"><div class="box"><h3>Аккаунт и синхронизация</h3>'+(s.at?'<p>Вы вошли как <b>'+esc(s.email)+'</b></p><button class="go" data-a="lo">Выйти</button>':'<span class="lb">Supabase URL</span><input id="a1" value="'+esc(s.url||(/^https?:$/.test(location.protocol)&&location.hostname!='localhost'?location.origin:'https://main.hidebrovpn.ru'))+'" placeholder="https://xxxx.supabase.co"><span class="lb">Supabase anon key</span><input id="a2" value="'+esc(s.key||'local')+'"><span class="lb">Почта</span><input id="a3" type="email" autocomplete="username" value="'+esc(s.email||'')+'"><span class="lb">Пароль</span><input id="a4" type="password" autocomplete="current-password"><div style="display:flex;gap:8px;margin-top:10px"><button class="go" style="padding:10px 24px" data-a="li">Войти</button><button class="ib bd" data-a="su">Регистрация</button></div>')+'<button class="ib bd" data-a="theme" style="margin-top:6px">Сменить тему</button><button class="ib" data-a="acx" style="margin-top:6px">Закрыть</button></div></div>'}
async function nat(){const L=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!L)return;try{await L.requestPermissions();const p=await L.getPending();if(p.notifications.length)await L.cancel({notifications:p.notifications});const n=Date.now(),a=S.tasks.filter(x=>!x.del&&!x.done&&x.date&&x.rem!==undefined&&x.rem!=='').map(x=>({x,at:new Date(x.date+'T'+(x.time||'09:00')).getTime()-x.rem*60000})).filter(o=>o.at>n).sort((a,b)=>a.at-b.at).slice(0,60);if(a.length)await L.schedule({notifications:a.map((o,i)=>({id:i+1,title:'Сделано',body:o.x.title,schedule:{at:new Date(o.at),allowWhileIdle:true}}))})}catch(e){}}
theme();try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme=='auto'){theme();render()}})}catch(e){}
render();chk();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!='localhost')navigator.serviceWorker.register('sw.js')}catch(e){}
nat();if(SB&&SB.at)sbStart();else(async()=>{try{const[db,u]=await Promise.all([claude.use('db'),claude.use('user')]);const id=u&&await u.id();if(!db||!id){setSync('Войдите в claude.ai, чтобы включить синхронизацию');return}
 const ref=db.collection('data/users/'+id).doc('state'),s=await ref.get();cloud=ref;if(s.exists&&s.data().ts>S.ts)pull(s);else push();ref.onSnapshot(pull);setSync('Синхронизировано');render()}catch(e){setSync('Синхронизация недоступна')}})();
</script>
