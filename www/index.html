<style>

.addh{display:flex;gap:8px;margin:6px 0 12px}.addh input,.addh select{background:var(--pn);border:0;border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}.addh input{flex:1}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:grid;place-items:center}.box{background:var(--pn);border-radius:16px;padding:20px;width:min(380px,92vw);display:flex;flex-direction:column;gap:6px}.box input{border:1px solid var(--ln);background:transparent;border-radius:10px;padding:10px 12px}.box h3{margin:0 0 6px}

.scrim{display:none}

 #menu,.acb{display:grid}
 .hd{padding:14px 16px 8px}.ttl h1,.h1i{font-size:26px}

 .bk{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}

 input,select,textarea{font-size:16px}
 .mg{min-width:0;grid-template-rows:auto repeat(6,minmax(54px,auto))}.chs{display:none}.dots{display:flex;gap:3px;justify-content:center;margin-top:4px}.dots i{width:6px;height:6px;border-radius:50%}.mc{text-align:center;padding:4px 2px}.dayl{display:block}
 .pm{grid-template-columns:1fr;overflow:auto}.pm>div{padding:0 16px;overflow:visible}.ring{width:240px;height:240px;margin:24px 0}.ring b{font-size:46px}

<body>
<div id="app"></div><div id="toast" aria-live="polite"></div><div id="acc"></div><div id="sheet"></div>
<script>
const K='sdelano.v2',DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],COL=['#3F7FD9','#D9694F','#3FA796','#9C6FD6','#C9962E','#D05A8C'],GR=['Утро','День','Ночь'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const P={mode:'pomo',run:false,left:1500,end:0,st:0,el:0};
const sv=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>',IC={tasks:sv('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'),cal:sv('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),pomo:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>'),hab:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),search:sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>'),acc:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>')};
function iso(n){const d=new Date();d.setDate(d.getDate()+n);return f(d)}
function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
if(!S){S={seed:1,tasks:[],lists:[{id:'l1',name:'Работа',c:COL[2]},{id:'l2',name:'Личное',c:COL[1]}],habits:[],focus:[],tab:'tasks',view:'today',sel:null,wk:0,mo:0,cm:'month',q:''};
 const T=iso(0);S.tasks=[
 {id:'a1',title:'Добро пожаловать! Нажмите на задачу, чтобы открыть детали',note:'Дата, время, приоритет, метки и подзадачи.',date:T,time:'09:00',prio:2,list:'inbox',done:false,del:false,tags:['старт'],subs:[{t:'Отметить подзадачу',d:false}]},
 {id:'a2',title:'Купить продукты',note:'',date:T,time:'18:30',prio:0,list:'l2',done:false,del:false,tags:[],subs:[{t:'Молоко',d:false},{t:'Хлеб',d:false}]},
 {id:'a3',title:'Подготовить отчёт',note:'',date:iso(2),time:'11:00',prio:3,list:'l1',done:false,del:false,tags:[],subs:[]}];
 S.habits=[['Утренняя зарядка','Утро'],['Выпить стакан воды','Утро'],['Учить 20 английских слов в день','Ночь'],['Тренировка','Ночь'],['Чтение','Ночь']].map((h,i)=>({id:'h'+i,name:h[0],g:h[1],days:{}}))}
S.yr=S.yr||0;S.md=S.md||0;S.nd=S.nd||3;S.theme=S.theme||'auto';S.ts=S.ts||(S.seed?0:Date.now());
let cloud=null,syncT=0,SY='Синхронизация не подключена';
function pack(){return{tasks:S.tasks,lists:S.lists,habits:S.habits,focus:S.focus,ts:S.ts}}
function save(){S.seed=0;S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(cloud){clearTimeout(syncT);syncT=setTimeout(push,800)}clearTimeout(natT);natT=setTimeout(nat,1500)}
function push(){const d=pack();cloud.set({json:JSON.stringify(d),ts:d.ts}).catch(()=>setSync('Ошибка синхронизации'))}
function pull(snap){if(!snap.exists)return;const d=snap.data();if(!d||d.ts<=S.ts)return;try{Object.assign(S,JSON.parse(d.json));if(!S.tasks.some(t=>t.id==S.sel))S.sel=null;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();setSync('Синхронизировано')}catch(e){}}
function setSync(m){SY=m;const b=document.getElementById('sy');if(b){b.title=m;b.style.color=cloud?'var(--ac)':'var(--mut)'}}
function theme(){document.documentElement.dataset.theme=S.theme=='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme}
function toast(m,keep){const t=document.getElementById('toast'),d=document.createElement('div');d.textContent=m;d.onclick=()=>d.remove();t.appendChild(d);setTimeout(()=>d.remove(),keep?20000:3500)}
